{% load static %}<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{{ title }} | Infinite360</title>
  <link rel="icon" type="image/png" href="{% static 'img/brand/favicon-32.png' %}">
  <link rel="stylesheet" href="{% static 'css/typography.css' %}">
  <style>
    :root { --gold: #2459E0; --ink: #14141b; --mute: #6b7280; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: var(--font-sans, system-ui, sans-serif); color: var(--ink); background: #F8FAFF;
      background-image: radial-gradient(circle at 85% 10%, rgba(36, 89, 224, .18), transparent 40%);
    }
    .err { width: min(520px, 100%); text-align: center; }
    .err-logo { display: inline-block; margin-bottom: 28px; }
    .err-logo img { height: 44px; width: auto; }
    .err-code {
      display: inline-flex; align-items: center; justify-content: center; min-width: 92px; height: 44px; padding: 0 18px;
      margin-bottom: 18px; border-radius: 999px; background: var(--ink); color: var(--gold); font-size: 20px; font-weight: 800; letter-spacing: .04em;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; }
    p { margin: 0 auto 28px; max-width: 420px; color: var(--mute); font-size: 1rem; line-height: 1.6; }
    .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .err-actions a {
      display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 12px;
      font-weight: 700; text-decoration: none; transition: transform .15s;
    }
    .err-actions a:hover { transform: translateY(-1px); }
    .err-primary { background: var(--gold); color: var(--ink); }
    .err-secondary { background: #fff; color: var(--ink); border: 1px solid #e5e7eb; }
    .err-actions a:focus-visible { outline: 3px solid rgba(36, 89, 224, .6); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="err">
    <a class="err-logo" href="/"><img src="{% static 'img/brand/logo-horizontal.png' %}" alt="Infinite360"></a>
    <div class="err-code">{{ status }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="err-actions">
      <a class="err-primary" href="/">Go to homepage</a>
      {% if status == 404 %}<a class="err-secondary" href="/test-series/">Browse test series</a>
      {% elif status == 403 %}<a class="err-secondary" href="{{ login_url|default:'/login/' }}">Log in</a>
      {% else %}<a class="err-secondary" href="javascript:history.back()">Go back</a>{% endif %}
    </div>
  </main>
</body>
</html>
